version: '3.8'

services:
  arcs:
    build: .
    container_name: arcs-comic-tracker
    # No ports: block — Traefik handles all inbound traffic.
    # If you need direct access for testing: uncomment the next two lines.
    # ports:
    #   - "4177:4177"
    environment:
      - PORT=4178
      - NODE_ENV=production
      - DATA_DIR=/data
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in .env}
      - ALLOW_PRIVATE_PROXY=${ALLOW_PRIVATE_PROXY:-false}
    volumes:
      - arcs-data:/data
    restart: unless-stopped
    networks:
      - t3_proxy        # ← Deployrr / Traefik network name (see note below)
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:4178/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    labels:
      # --- Traefik routing ---
      - "traefik.enable=true"

      # HTTP → HTTPS redirect (Traefik handles this via the web entrypoint)
      - "traefik.http.routers.arcs-http.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.arcs-http.entrypoints=web"
      - "traefik.http.routers.arcs-http.middlewares=redirect-to-https"

      # HTTPS router
      - "traefik.http.routers.arcs.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.arcs.entrypoints=websecure"
      - "traefik.http.routers.arcs.tls=true"
      - "traefik.http.routers.arcs.tls.certresolver=letsencrypt"

      # Tell Traefik which port the container listens on
      - "traefik.http.services.arcs.loadbalancer.server.port=4178"

      # Deployrr-specific: mark as managed
      - "deployrr.managed=true"

volumes:
  arcs-data:

networks:
  t3_proxy:
    external: true   # This network is created and owned by Deployrr/Traefik
