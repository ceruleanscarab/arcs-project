services:
  arcs:
    build: .
    container_name: arcs-comic-tracker
    environment:
      - PORT=4178
      - NODE_ENV=production
      - DATA_DIR=/data
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in .env}
      - ALLOW_PRIVATE_PROXY=${ALLOW_PRIVATE_PROXY:-false}
    volumes:
      - arcs-data:/data
    restart: unless-stopped
    networks:
      - t3_proxy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4178/', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    labels:
      - "traefik.enable=true"

      # HTTP entrypoint — just forward to HTTPS
      - "traefik.http.routers.arcs-http.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.arcs-http.entrypoints=web"
      - "traefik.http.routers.arcs-http.middlewares=redirect-to-https@file"

      # HTTPS router — use Deployrr's external entrypoint and dns-cloudflare resolver
      - "traefik.http.routers.arcs.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.arcs.entrypoints=websecure-external"
      - "traefik.http.routers.arcs.tls=true"
      - "traefik.http.routers.arcs.tls.certresolver=dns-cloudflare"

      # Port the container listens on
      - "traefik.http.services.arcs.loadbalancer.server.port=4178"

      - "deployrr.managed=true"

volumes:
  arcs-data:

networks:
  t3_proxy:
    external: true
